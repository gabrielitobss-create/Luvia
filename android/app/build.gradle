plugins {
    id("com.android.application")
    id("com.facebook.react")
}

react {
    autolinkLibrariesWithApp()
    // The CI debug APK is installed directly on the phone, so it must
    // contain the JavaScript bundle instead of requiring a Metro server.
    debuggableVariants = []
}

def backendUrl = providers.gradleProperty("LUVIA_BACKEND_URL")
    .orElse("http://10.0.2.2:8080/")
    .get()

android {
    namespace "com.luvia.ai"
    compileSdk 35

    defaultConfig {
        applicationId "com.luvia.ai"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.2.0"
        buildConfigField "String", "BACKEND_URL", "\"\${backendUrl}\""
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation("com.facebook.react:react-android") }

if (hermesEnabled.toBoolean()) {
    dependencies { implementation("com.facebook.react:hermes-android") }
}
