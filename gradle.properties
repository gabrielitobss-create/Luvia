# Required for AndroidX/Jetpack Compose dependencies during :app:checkDebugAarMetadata.
android.useAndroidX=true
# Keep Kotlin formatting and generated sources consistent across local builds and CI.
kotlin.code.style=official
# Provide enough heap for Gradle and D8 while building the debug APK in CI.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
