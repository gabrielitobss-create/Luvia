name: Build debug APK

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React Native dependencies
        run: npm install
      - name: Verify React Native config
        run: |
          npx react-native config > /tmp/react-native-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/react-native-config.json', 'utf8'));
          const android = config.project && config.project.android;
          console.log(JSON.stringify(android, null, 2));
          if (!android || android.packageName !== 'com.luvia.ai') {
            console.error('Invalid React Native Android project config:', JSON.stringify(android));
            process.exit(1);
          }
          NODE
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Test backend
        working-directory: backend
        run: npm test
      # ubuntu-latest already provides the Android SDK. Avoid setup-android,
      # which was failing before Gradle could begin the build.
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Build debug APK
        run: ./gradlew -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: luvia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
